[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wizctl"
version = "0.1.0"
description = "Control Philips WiZ lights over LAN - no cloud, no bridge, no dependencies."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.6"

[project.scripts]
wizctl = "wizctl:main"

[tool.setuptools]
py-modules = ["wizctl"]
