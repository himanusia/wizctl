[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wizctl"
version = "0.5.0"
description = "Control Philips WiZ lights over LAN - no cloud, no bridge, no dependencies."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.7"

[project.scripts]
wiz = "wiz:main"

[tool.setuptools]
py-modules = ["wiz"]
